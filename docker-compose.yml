services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      SHARED_BRAIN_URL: ${SHARED_BRAIN_URL:-http://shared-brain-mcp:3100}
      SHARED_BRAIN_API_KEY: ${SHARED_BRAIN_API_KEY}
      OPENCLAW_SIGNAL_INBOUND_ENABLED: ${OPENCLAW_SIGNAL_INBOUND_ENABLED:-true}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ${SIGNAL_CLI_DATA_DIR}:/home/node/.local/share/signal-cli
      # Phase-3: gateway client identity (CN=openclaw-gateway) for mTLS to signal-proxy.
      - /home/ohio_/.signal-proxy/gateway:/certs/signal:ro
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    networks:
      - default
      - shared-brain
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.openclaw.rule=Host(`openclaw.nexus`)
      - traefik.http.routers.openclaw.entrypoints=web,websecure
      - traefik.http.routers.openclaw.tls=true
      - traefik.http.services.openclaw.loadbalancer.server.port=18789
      - traefik.http.routers.openclaw-tunnel.rule=Host(`openclaw.n3xus.uk`)
      - traefik.http.routers.openclaw-tunnel.entrypoints=web
      - traefik.http.routers.openclaw-tunnel.service=openclaw
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      SHARED_BRAIN_URL: ${SHARED_BRAIN_URL:-http://shared-brain-mcp:3100}
      SHARED_BRAIN_API_KEY: ${SHARED_BRAIN_API_KEY}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]

networks:
  shared-brain:
    external: true
    name: shared-brain-mcp_default
  edge:
    external: true
    name: edge
